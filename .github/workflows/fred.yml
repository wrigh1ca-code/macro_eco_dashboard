# Refresh the FRED data every morning and commit it. If the repo is
# connected to Vercel (or Netlify, or GitHub Pages), the push redeploys the site.
name: Refresh FRED data

# The Cloudflare Worker's morning timer (worker/index.js) starts this run through
# workflow_dispatch. GitHub's own schedule below is kept as a backup; if both
# fire, the second run finds nothing new and commits nothing.
on:
  schedule:
    - cron: '17 11 * * *' # every day, 11:17 UTC (early morning in the U.S.), after FRED posts the previous day's data
  workflow_dispatch:

permissions:
  contents: write

# Never run two refreshes at once, so they can't trip over each other's commits.
concurrency:
  group: fred-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-fred.mjs
        env:
          # Free key from fredaccount.stlouisfed.org, saved under Settings > Secrets and variables > Actions.
          # Without it the script falls back to FRED's graph download, which sometimes refuses automated requests.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fred
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh FRED data"
            git push
          fi
